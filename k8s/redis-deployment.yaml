# -----------------------------------------------------------------------
# Redis — almacén temporal de resultados de scraping (cache)
# -----------------------------------------------------------------------

# Deployment: mantiene 1 réplica de Redis siempre corriendo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: comparasupers
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine        # imagen oficial, alpine = más pequeña
          ports:
            - containerPort: 6379
          # Guardar datos en disco para que sobrevivan reinicios del pod
          args: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}   # en producción usaríamos PersistentVolumeClaim

---
# Service: expone Redis dentro del cluster con DNS "redis-service"
# Los otros pods se conectan con redis://redis-service:6379
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: comparasupers
  labels:
    app: redis
spec:
  selector:
    app: redis          # conecta con los pods que tienen este label
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP       # solo accesible dentro del cluster (no expuesto al exterior)
